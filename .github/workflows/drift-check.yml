name: Config Drift Check

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  drift-check:
    name: Detect Config Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Config Drift Detector
        run: |
          git clone https://github.com/UduthaMurali/config-drift-detector.git .drift-tool
          pip install -r .drift-tool/requirements.txt --quiet

      - name: Run Config Drift Check
        id: drift
        run: |
          set -o pipefail
          python .drift-tool/main.py \
            --source app/ \
            --config config/ \
            --languages python \
            --fail-on-drift \
            --json | tee drift-report.json
        continue-on-error: true

      - name: Post drift report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('drift-report.json', 'utf8'));
            } catch (e) {
              report = { drift_level: 'ERROR', drift_score: 0, missing_in_config: [] };
            }
            const level = report.drift_level || 'UNKNOWN';
            const score = report.drift_score || 0;
            const items = report.missing_in_config || [];
            const emoji = { NONE: 'SUCCESS', LOW: 'WARNING', MEDIUM: 'BLOCKED', HIGH: 'BLOCKED' }[level] || 'UNKNOWN';
            let body = `## Config Drift Report - ${emoji}\n\n`;
            body += `**Drift Level:** ${level}  |  **Drift Score:** ${score}\n\n`;
            if (items.length === 0) {
              body += `All environment variables are declared in deployment config.\nNo drift detected - safe to merge!\n`;
            } else {
              const critical = items.filter(i => i.severity === 'critical');
              const warnings = items.filter(i => i.severity === 'warning');
              if (critical.length > 0) {
                body += `### CRITICAL - ${critical.length} variable(s) have NO default value\n`;
                body += `App will crash if deployed without these.\n\n`;
                body += `| Variable | File | Line |\n|---|---|---|\n`;
                for (const item of critical) {
                  body += `| ${item.variable} | ${item.file} | ${item.line || '-'} |\n`;
                }
                body += `\n`;
              }
              if (warnings.length > 0) {
                body += `### WARNING - ${warnings.length} variable(s) have a default but are not declared in config\n\n`;
                body += `| Variable | File | Line |\n|---|---|---|\n`;
                for (const item of warnings) {
                  body += `| ${item.variable} | ${item.file} | ${item.line || '-'} |\n`;
                }
                body += `\n`;
              }
              body += `---\nAdd the missing variables to your deployment config before merging.\n`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Block PR on critical drift
        if: steps.drift.outcome == 'failure'
        run: |
          echo "CRITICAL CONFIG DRIFT DETECTED"
          echo "Add missing variables to deployment config before merging."
          exit 1