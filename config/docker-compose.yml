# ============================================================
#  Weather App — Docker Compose (deployment config)
#  ⚠️  Only 2 env vars declared here.
#      After v3, the app needs 17 — but this file never changes!
# ============================================================

version: '3.8'

services:
  weather-app:
    build: ..
    image: weather-app:latest
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - OPENWEATHER_API_KEY
      - PORT
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
