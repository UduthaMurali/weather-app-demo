version: '3.8'

services:
  weather-app:
    build: ../..
    image: weather-app:latest
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - OPENWEATHER_API_KEY
      - PORT
      - REDIS_URL
      - LOG_LEVEL
      - DATABASE_URL
      - DB_USER
      - DB_PASSWORD
      - JWT_SECRET
      - RATE_LIMIT_PER_HOUR
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=weatherapp
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
